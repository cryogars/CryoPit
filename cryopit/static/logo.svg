<svg class="cryopit-logo" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CryoPit">
  <!-- CryoPit snowflake. Draws in `currentColor`, so it inherits the text
       color wherever it's inlined (the app topbar forces white via
       `.tb-brand .cryopit-logo{color:#fff}`). Used standalone — <img>,
       favicon, docs — the scoped style below makes it ink-dark on light
       backgrounds and light on dark ones. -->
  <style>
    .cryopit-logo{color:#0b1626}
    @media (prefers-color-scheme: dark){.cryopit-logo{color:#e8eef6}}
  </style>
  <line x1="11" y1="1" x2="11" y2="21" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.9"/>
  <line x1="1" y1="11" x2="21" y2="11" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.9"/>
  <line x1="3.05" y1="3.05" x2="18.95" y2="18.95" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.9"/>
  <line x1="18.95" y1="3.05" x2="3.05" y2="18.95" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.9"/>
  <circle cx="11" cy="1" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="11" cy="21" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="1" cy="11" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="21" cy="11" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="3.05" cy="3.05" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="18.95" cy="18.95" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="18.95" cy="3.05" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="3.05" cy="18.95" r="1.8" fill="currentColor" fill-opacity="0.9"/>
  <circle cx="11" cy="11" r="2.5" fill="currentColor" fill-opacity="0.95"/>
</svg>
