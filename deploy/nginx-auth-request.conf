# Illustrative Nginx boundary for an institution-managed SSO gateway.
# Adapt auth_request, TLS, DNS, and certificate directives to local policy.
# CryoPit itself never accepts credentials and must not be directly reachable.

upstream cryopit_app {
    server 127.0.0.1:8502;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name cryopit.example.edu;

    ssl_certificate     /etc/ssl/certs/cryopit-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/cryopit-key.pem;

    # The institution supplies this endpoint. It returns 2xx only for an
    # authenticated request and sets X-Authenticated-Subject in its response.
    location = /_sso_auth {
        internal;
        proxy_pass http://institution_sso_gateway/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        auth_request /_sso_auth;
        auth_request_set $verified_subject $upstream_http_x_authenticated_subject;

        # Never forward an identity supplied by the browser. This directive
        # overwrites the header with the value returned by trusted SSO.
        proxy_set_header X-Remote-User $verified_subject;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_request_buffering on;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://cryopit_app;
    }
}
